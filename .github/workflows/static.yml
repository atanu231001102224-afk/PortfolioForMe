name: Deploy React Portfolio

on:
  push:
    branches:
      - main  # Change to master if your default branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Tells Node where to find the package-lock.json file for caching
          cache-dependency-path: ./Assingment-1/package-lock.json 

      - name: Install Dependencies
        working-directory: ./Assingment-1  # 👈 Tells GitHub to open this folder first
        run: npm ci 

      - name: Build Project
        working-directory: ./Assingment-1  # 👈 Tells GitHub to build inside this folder
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Assingment-1/dist # 👈 Points directly to Vite's build output inside the folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
